<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "Jashandeep Singh" }}</title>
  <style>
    body {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.65;
      color: #222;
      background: #fff;
    }

    header {
      margin-bottom: 30px;
    }

    .site-title {
      font-size: 22px;
      font-weight: 600;
      color: #111;
      text-decoration: none;
    }

    .site-desc {
      color: #777;
      font-size: 14px;
      margin-top: 4px;
    }

    hr {
      border: 0;
      border-top: 1px solid #eaeaea;
      margin: 16px 0 30px 0;
    }

    a {
      color: #216dd5;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Headings */
    h1, h2, h3 {
      color: #111;
      line-height: 1.3;
    }

    h1 {
      font-size: 26px;
      margin: 0 0 6px 0;
      font-weight: 600;
    }

    /* Post metadata & listings */
    .post-date {
      color: #888;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .post-entry {
      margin-bottom: 26px;
    }

    .post-title {
      font-size: 18px;
      font-weight: 500;
      display: block;
      margin-bottom: 4px;
    }

    .post-snippet {
      color: #444;
      font-size: 15px;
      margin: 0;
    }

    /* Code styling */
    code {
      background: #f6f6f6;
      padding: 2px 6px;
      font-size: 0.9em;
      font-family: SFMono-Regular, Consolas, Menlo, Monaco, monospace;
      border-radius: 3px;
    }

    pre code {
      display: block;
      padding: 12px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="site-title">Jashandeep Singh</a>
    <div class="site-desc">technology & entrepreneurship</div>
    <hr>
  </header>

  <main>
    {% if page.date %}
      <h1>{{ page.title }}</h1>
      <div class="post-date">{{ page.date | date: "%b %d, %Y" }}</div>
    {% endif %}

    {{ content }}
  </main>
</body>
</html>
