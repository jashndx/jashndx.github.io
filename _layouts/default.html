<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "Notes" }}</title>
  <style>
    body {
      max-width: 650px;
      margin: 40px auto;
      padding: 0 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #111;
      background: #fff;
    }
    a { color: #0000ee; }
    h1, h2, h3 { line-height: 1.25; margin-top: 1.5em; }
    code { background: #f4f4f4; padding: 2px 5px; font-size: 0.9em; font-family: monospace; }
    pre code { display: block; padding: 12px; overflow-x: auto; }
    hr { border: 0; border-top: 1px solid #ddd; margin: 20px 0; }
    ul { padding-left: 20px; }
  </style>
</head>
<body>
  <p><a href="/"><b>← Home</b></a></p>
  <hr>
  {{ content }}
</body>
</html>
