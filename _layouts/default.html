<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "Jashan" }}</title>
  
  <!-- Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      max-width: 720px;
      margin: 48px auto;
      padding: 0 20px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: #171717;
      background: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #eaeaea;
      padding-bottom: 16px;
      margin-bottom: 40px;
    }

    .brand {
      font-weight: 600;
      font-size: 18px;
      color: #000;
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .tagline {
      font-size: 14px;
      color: #737373;
    }

    a {
      color: #000000;
      text-decoration: underline;
      text-decoration-color: #d4d4d4;
      text-underline-offset: 3px;
      transition: text-decoration-color 0.15s ease;
    }

    a:hover {
      text-decoration-color: #000000;
    }

    h1, h2, h3 {
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0a0a0a;
      line-height: 1.3;
    }

    h1 { font-size: 28px; margin: 0 0 8px 0; }

    .post-entry {
      margin-bottom: 32px;
    }

    .post-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #737373;
      margin-bottom: 4px;
    }

    .post-title {
      font-size: 18px;
      font-weight: 500;
      display: inline-block;
      text-decoration: none;
      color: #0a0a0a;
      margin-bottom: 4px;
    }

    .post-title:hover {
      text-decoration: underline;
    }

    .post-snippet {
      color: #404040;
      font-size: 15px;
      margin: 0;
      line-height: 1.6;
    }

    code {
      font-family: 'JetBrains Mono', monospace;
      background: #f5f5f5;
      padding: 2px 6px;
      font-size: 0.88em;
      border-radius: 4px;
    }

    pre code {
      display: block;
      padding: 16px;
      overflow-x: auto;
      border: 1px solid #eaeaea;
      background: #fafafa;
    }

    hr {
      border: 0;
      border-top: 1px solid #eaeaea;
      margin: 32px 0;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand">Jashan</a>
    <span class="tagline">technology & entrepreneurship</span>
  </header>
  <main>
    {{ content }}
  </main>
</body>
</html>
